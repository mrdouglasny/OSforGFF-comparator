status:
  scope: >
    This repository carries the registry submission for the OSforGFF library: a
    self-contained Mathlib-only restatement of its headline result (Challenge.lean, whose
    single `sorry` is the challenge hole) and the proof of that restatement from the
    library (Solution.lean), wired through comparator.json. The theorem: for every
    dimension d >= 2 and mass m > 0 there exists a probability measure on the tempered
    distributions S'(R^d), characterized uniquely by its Gaussian generating functional
    with the proper-time free covariance, satisfying all five Osterwalder-Schrader axioms
    (OS0 analyticity, OS1 regularity, OS2 Euclidean invariance, OS3 reflection
    positivity, OS4 clustering + ergodicity). The substantive development — the
    dimension-generic construction via the Minlos theorem, the OS proofs, and the
    concrete propagator instances at d = 2, 3, 4, 5 — lives in mrdouglasny/OSforGFF at
    the pinned commit; its formalization.yaml there documents the library's own scope
    and headline theorems.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - declaration: "Challenge.gaussianFreeField_satisfies_OS_axioms"
      file: "Solution.lean"
      sorry_count: 0
      axioms: []
      comparator_config: "comparator.json"
      literature_dependencies:
        - statement: "for every d >= 2 and m > 0 the free GFF exists on S'(R^d), is characterized by its Gaussian generating functional with the proper-time covariance, and satisfies OS0-OS4"
          source: "10.1007/BF01645738"
        - statement: "reflection positivity in the complex star formulation (axiom E2)"
          source: "10.1007/BF01608978"
        - statement: "probability-measure formulation of the OS axioms"
          source: "ISBN:978-0-387-96477-7"

